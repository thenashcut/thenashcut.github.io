<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>nash</title>
  <link rel="icon" type="image/png" href="/nash_circle_wave2.png" />
  <style>

    .site-header {
  width: 100%;
  position: absolute;
  top: 0;
  left: 0;
  z-index: 10;
  padding: 20px 24px;
}

.site-nav {
  width: min(1100px, 100%);
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.nav-brand {
  color: #ffffff;
  font-size: 1.25rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-decoration: none;
  text-transform: lowercase;
}

.nav-links {
  display: flex;
  align-items: center;
  gap: 28px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.nav-links a {
  display: inline-flex;
  align-items: center;
  min-height: 44px;
  color: rgba(255, 255, 255, 0.82);
  font-size: 0.9rem;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-decoration: none;
  text-transform: uppercase;
  transition: color 0.2s ease, opacity 0.2s ease;
}

.nav-links a:hover {
  color: #ffffff;
}

.nav-links a:focus-visible,
.nav-brand:focus-visible,
.menu-button:focus-visible {
  outline: 2px solid #ffffff;
  outline-offset: 5px;
}

/* Hamburger button is hidden on larger screens. */
.menu-button {
  display: none;
  width: 44px;
  height: 44px;
  padding: 10px;
  background: transparent;
  border: 1px solid rgba(255, 255, 255, 0.28);
  border-radius: 8px;
  cursor: pointer;
}

.menu-button span {
  display: block;
  width: 100%;
  height: 2px;
  margin: 5px 0;
  background: #ffffff;
  transition: transform 0.2s ease, opacity 0.2s ease;
}

/* Mobile navigation */
@media (max-width: 700px) {
  .site-header {
    padding: 16px 18px;
  }

  .menu-button {
    display: block;
  }

  .nav-links {
    display: none;
    position: absolute;
    top: 70px;
    right: 18px;
    width: min(260px, calc(100vw - 36px));
    padding: 12px;
    flex-direction: column;
    align-items: stretch;
    gap: 2px;
    background: rgba(12, 12, 12, 0.97);
    border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 14px;
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.48);
  }

  .nav-links.is-open {
    display: flex;
  }

  .nav-links a {
    width: 100%;
    padding: 8px 14px;
    border-radius: 8px;
  }

  .nav-links a:hover {
    background: rgba(255, 255, 255, 0.08);
  }

  .menu-button.is-open span:nth-child(1) {
    transform: translateY(7px) rotate(45deg);
  }

  .menu-button.is-open span:nth-child(2) {
    opacity: 0;
  }

  .menu-button.is-open span:nth-child(3) {
    transform: translateY(-7px) rotate(-45deg);
  }
}
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at center, #2a2a2a 0%, #111 55%, #050505 100%);
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 24px;
    }

    .content {
      max-width: 720px;
      width: 100%;
      padding: 48px 28px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      background: rgba(0, 0, 0, 0.28);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(8px);
    }

    .logo {
      width: min(420px, 85vw);
      height: auto;
      display: block;
      margin: 0 auto 24px;
}

    p {
      margin: 12px 0;
      font-size: clamp(1rem, 2.8vw, 1.35rem);
      line-height: 1.45;
      color: rgba(255, 255, 255, 0.88);
    }

    .tagline {
      color: #ffffff;
      font-weight: 600;
      letter-spacing: 0.04em;
    }

    .contact-link {
      text-decoration: none;
    }

    .contact-link:hover {
      opacity: 0.72;
    }
    
    a {
      color: #ffffff;
      text-decoration: underline;
      text-underline-offset: 5px;
      transition: opacity 0.2s ease;
    }

    a:hover {
      opacity: 0.72;
    }

    .coming-soon {
      margin-top: 24px;
      font-size: 0.95rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.58);
    }
  </style>
</head>
<body>
  <header class="site-header">
    <nav class="site-nav" aria-label="Main navigation">
      <a class="nav-brand" href="/">
        Nash
      </a>
  
      <button
        class="menu-button"
        type="button"
        aria-expanded="false"
        aria-controls="navigation-links"
        aria-label="Open navigation menu"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>
  
      <ul class="nav-links" id="navigation-links">
        <li><a href="/">Home</a></li>
        <li><a href="/about/">About</a></li>
        <li><a href="/schedule/">Schedule</a></li>
        <li><a href="/mixes/">Mixes</a></li>
        <li><a href="/contact/">Contact</a></li>
      </ul>
    </nav>
</header>
  
  <main class="content">
    <a href="../">
      <img
        src="../Nash_logo_white.svg"
        alt="The Nash Cut"
        class="logo"
      />
    </a>
</p>
    
  </main>
  <script>
    const menuButton = document.querySelector(".menu-button");
    const navigationLinks = document.querySelector(".nav-links");
  
    menuButton.addEventListener("click", () => {
      const isOpen =
        menuButton.getAttribute("aria-expanded") === "true";
  
      menuButton.setAttribute(
        "aria-expanded",
        String(!isOpen)
      );
  
      menuButton.setAttribute(
        "aria-label",
        isOpen
          ? "Open navigation menu"
          : "Close navigation menu"
      );
  
      menuButton.classList.toggle("is-open");
      navigationLinks.classList.toggle("is-open");
    });
  
    navigationLinks.addEventListener("click", (event) => {
      if (event.target.matches("a")) {
        menuButton.setAttribute("aria-expanded", "false");
        menuButton.setAttribute(
          "aria-label",
          "Open navigation menu"
        );
  
        menuButton.classList.remove("is-open");
        navigationLinks.classList.remove("is-open");
      }
    });
  </script>
</body>
</html>
