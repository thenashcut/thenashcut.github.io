<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>nash</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at center, #2a2a2a 0%, #111 55%, #050505 100%);
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 24px;
    }

    .content {
      max-width: 720px;
      width: 100%;
      padding: 48px 28px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      background: rgba(0, 0, 0, 0.28);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(8px);
    }

    .logo {
      width: min(420px, 85vw);
      height: auto;
      display: block;
      margin: 0 auto 24px;
}

    p {
      margin: 12px 0;
      font-size: clamp(1rem, 2.8vw, 1.35rem);
      line-height: 1.45;
      color: rgba(255, 255, 255, 0.88);
    }

    .tagline {
      color: #ffffff;
      font-weight: 600;
      letter-spacing: 0.04em;
    }

    .contact-link {
      text-decoration: none;
    }

    .contact-link:hover {
      opacity: 0.72;
    }
    
    a {
      color: #ffffff;
      text-decoration: underline;
      text-underline-offset: 5px;
      transition: opacity 0.2s ease;
    }

    a:hover {
      opacity: 0.72;
    }

    .coming-soon {
      margin-top: 24px;
      font-size: 0.95rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.58);
    }
  </style>
</head>
<body>
  <header class="site-header">
  <nav class="site-nav" aria-label="Main navigation">
    <a class="nav-brand" href="/">
      Nash
    </a>

    <button
      class="menu-button"
      type="button"
      aria-expanded="false"
      aria-controls="navigation-links"
      aria-label="Open navigation menu"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>

    <ul class="nav-links" id="navigation-links">
      <li><a href="/">Home</a></li>
      <li><a href="/about/">About</a></li>
      <li><a href="/schedule/">Schedule</a></li>
      <li><a href="/mixes/">Mixes</a></li>
      <li><a href="/weirdfrontiers/">Weird Frontiers</a></li>
      <li><a href="/contact/">Contact</a></li>
    </ul>
  </nav>
</header>
  <main class="content">
    <h1><img src="Nash_logo_white.svg" alt="nash logo" class="logo"</h1>
    <p class="tagline">vinyl jockey | Charlotte, NC</p>
    <p>playing bars, parties, and private events.</p>
    <p>
  <a href="schedule/">Upcoming gigs</a>
</p>
    
    <p>
      <a class="contact-link" href="mailto:booking@thenashcut.com">
        booking@thenashcut.com
      </a>
    </p>
      
    <p>IG:
      <a
        class="contact-link"
        href="https://www.instagram.com/thenashcut"
        target="_blank"
        rel="noopener noreferrer"
      >
        @thenashcut
      </a>
    </p>
    <p class="coming-soon">website coming soon</p>
  </main>
</body>
</html>
